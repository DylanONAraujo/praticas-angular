<form [formGroup]='form'>
    <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="16px" class="linha-formulario">
        <div class="col-md-6" fxFlex="80" style="margin-left: 16px;">
            <mat-form-field appearance="standard">
                <mat-label class="button"  >Descrição da tarefa</mat-label>
                <input matInput formControlName="descricao"/>
            </mat-form-field>
            <button mat-button mat-raised-button color="primary" (click)="adcionarTarefa()">Adicionar</button>
        </div>
        <div class="col">
        </div>
    </div>
</form>

<div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" matSort>

        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
            <td mat-cell *matCellDef="let exercico1"> {{exercico1.id}} </td>
        </ng-container>

        <ng-container matColumnDef="descricao">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Descrição </th>
            <td mat-cell *matCellDef="let exercico1"> {{exercico1.descricao}} </td>
        </ng-container>

        <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef> Status </th>
        <td mat-cell *matCellDef="let element; let i = index">
          <mat-checkbox
            [checked]="element.status === 'true'"
            (change)="alterarStatus(i, $event.checked)">
            {{ element.status === 'true' ? 'Concluída' : 'Pendente' }}
          </mat-checkbox>
        </td>
      </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Selecione uma paginas:"></mat-paginator>
