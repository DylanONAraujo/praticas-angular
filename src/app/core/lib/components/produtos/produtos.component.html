

<div class="products">

<mat-card class="example-card" *ngFor="let product of products">

  <mat-card-header>
    <div mat-card-avatar class="example-header-image"  [ngStyle]="{'background-image': 'url(' + product.imagem + ')'}"></div>

    <mat-card-title>{{ product.nome }}</mat-card-title>
    <mat-card-subtitle>{{ product.descricao }}</mat-card-subtitle>
  </mat-card-header>
  <div class="img-container">
  <img mat-card-image [src]="product.imagem" alt="Imagem do produto">
  </div>
  <mat-card-content>
   
  </mat-card-content>
  <mat-card-actions>
    <button mat-raised-button class="btn-carrinho" (click)="addToCart(product.nome)">COLOCAR NO CARRINHO</button>
  </mat-card-actions>
</mat-card>

</div>
