<div class="mat-elevation-z8">
  <table mat-table [dataSource]="dataSource" matSort>


    <ng-container *ngFor="let coluna of displayedColumns" [matColumnDef]="coluna">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> {{ coluna }}</th>

      <ng-container *ngIf="coluna === 'status'">
        <td mat-cell *matCellDef="let element; let i = index">
          <mat-checkbox [checked]="element.status === 'true'" (change)="alterarStatus(i, $event.checked)">
            {{ element.status === true ? 'Concluída' : 'Pendente' }}
          </mat-checkbox>
        </td>
      </ng-container>

      <td mat-cell *matCellDef="let table"> {{ table[coluna] }} </td>
    </ng-container>


    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Selecione uma paginas:"></mat-paginator>

</div>
